version: '3.8'

services:
  web:
    build: .
    expose:
      - "5002"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379" 
    volumes:
    - redis-data:/data # This volume is used to persist Redis data across container restarts
  nginx:
    image: nginx:latest # This service uses the official Nginx image and maps port 5002 on the host to port 5002 in the container.
    ports:
    - "5002:5002"
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf # This line mounts the nginx.conf file from the host to the container, allowing you to customize Nginx's configuration.
    depends_on:
    - web     
volumes:
  redis-data: